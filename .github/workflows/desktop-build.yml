name: desktop-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pywebview

      - name: Build Patrimony.exe
        run: pyinstaller --clean --noconfirm desktop/patrimony.spec

      - name: Smoke test (server responds)
        shell: pwsh
        run: |
          $env:PATRIMONY_NO_WINDOW = '1'
          $p = Start-Process -FilePath dist\Patrimony\Patrimony.exe -PassThru
          $line = ''
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Host "launcher exited early, code $($p.ExitCode)"; break }
            if (Test-Path dist\Patrimony\url.txt) {
              $line = (Get-Content dist\Patrimony\url.txt -First 1).Trim()
              if ($line) { break }
            }
          }
          if (Test-Path dist\Patrimony\error.log) { Write-Host '--- error.log ---'; Get-Content dist\Patrimony\error.log }
          Write-Host "launcher url: $line"
          if (-not $line -or -not $line.StartsWith('http://127.0.0.1:')) { throw "launcher did not start" }
          $base = $line.TrimEnd('/')
          $resp = Invoke-WebRequest -Uri "$base/api/version" -UseBasicParsing -TimeoutSec 15
          Write-Host "version response: $($resp.Content)"
          if ($resp.StatusCode -ne 200) { throw "API not responding" }
          $ui = (Invoke-WebRequest -Uri "$base/" -UseBasicParsing -TimeoutSec 15).Content
          if ($ui -notmatch 'navMore') { throw "UI not served from bundle" }
          Write-Host "UI check: navMore found in bundle HTML"
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Debug files (always)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path debug | Out-Null
          Copy-Item dist\url.txt debug\ -ErrorAction SilentlyContinue
          Copy-Item dist\error.log debug\ -ErrorAction SilentlyContinue
          Get-ChildItem debug -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PatrimonyDesktop-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package
        shell: pwsh
        run: |
          Remove-Item dist\Patrimony\url.txt -ErrorAction SilentlyContinue
          Remove-Item dist\Patrimony\error.log -ErrorAction SilentlyContinue
          Remove-Item dist\Patrimony\desktop.log -ErrorAction SilentlyContinue
          Remove-Item dist\Patrimony\data -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item desktop\LISEZ-MOI.txt dist\Patrimony\
          Copy-Item desktop\README.txt dist\Patrimony\
          Copy-Item desktop\LIESMICH.txt dist\Patrimony\
          Copy-Item desktop\LIES-MICH.txt dist\Patrimony\
          Compress-Archive -Path dist\Patrimony -DestinationPath Patrimony-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatrimonyDesktop-windows
          path: Patrimony-Windows.zip
          retention-days: 90

  macos:
    runs-on: macos-latest      # arm64 (Apple Silicon)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pywebview

      - name: Build Patrimony.app
        run: pyinstaller --clean --noconfirm desktop/patrimony.spec

      - name: Ad-hoc signing (required on Apple Silicon)
        run: |
          codesign --force --deep --sign - --timestamp=none dist/Patrimony.app
          codesign -dv dist/Patrimony.app 2>&1 | grep -i signature

      - name: "Smoke test (headless: server + API + UI from the bundle)"
        env:
          PATRIMONY_NO_WINDOW: '1'
        run: |
          ./dist/Patrimony.app/Contents/MacOS/Patrimony &
          PID=$!
          for i in $(seq 1 60); do
            sleep 2
            [ -s dist/url.txt ] && break
          done
          if [ -f dist/error.log ]; then echo '--- error.log ---'; cat dist/error.log; fi
          LINE="$(head -n 1 dist/url.txt 2>/dev/null || true)"
          echo "launcher url: $LINE"
          case "$LINE" in http://127.0.0.1:*) ;; *) echo "launcher did not start"; kill $PID 2>/dev/null || true; exit 1;; esac
          BASE="${LINE%/}"
          curl -fsS "$BASE/api/version"; echo
          curl -fsS "$BASE/" | grep -q navMore
          echo "UI check: navMore found in bundle HTML"
          kill $PID 2>/dev/null || true

      - name: "Window smoke test (best effort: real window)"
        continue-on-error: true
        run: |
          rm -f dist/url.txt
          open dist/Patrimony.app
          sleep 25
          LINE="$(head -n 1 dist/url.txt 2>/dev/null || true)"
          echo "windowed url: $LINE"
          if [ -n "$LINE" ]; then curl -fsS "${LINE%/}/api/version"; echo; fi
          pgrep -fl 'Patrimony.app/Contents/MacOS' || echo 'process not found'
          pkill -f '[P]atrimony.app/Contents/MacOS' || true

      - name: Debug files (always)
        if: always()
        run: |
          mkdir -p debug
          cp dist/url.txt debug/ 2>/dev/null || true
          cp dist/error.log debug/ 2>/dev/null || true
          cp dist/desktop.log debug/ 2>/dev/null || true
          ls -la debug/ || true

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PatrimonyDesktop-macos-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: "Package (zip with user guides in 4 languages)"
        run: |
          rm -rf "Patrimony-macOS"
          mkdir -p "Patrimony-macOS"
          ditto dist/Patrimony.app "Patrimony-macOS/Patrimony.app"
          cp desktop/macos/LISEZ-MOI.txt desktop/macos/README.txt desktop/macos/LIESMICH.txt desktop/macos/LIES-MICH.txt "Patrimony-macOS/"
          rm -f "Patrimony-macOS/url.txt" "Patrimony-macOS/desktop.log" "Patrimony-macOS/error.log"
          ditto -c -k --sequesterRsrc --keepParent "Patrimony-macOS" "Patrimony-macOS.zip"
          unzip -l "Patrimony-macOS.zip" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatrimonyDesktop-macos
          path: Patrimony-macOS.zip
          retention-days: 90
